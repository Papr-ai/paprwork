name: Deploy Cloud Agent Gateway

# Change-management pipeline for the cloud agent gateway (same shape as Deploy Cloud App Host).
#
#   development --push--> test -> build -> deploy to papr-cloud-agent-gateway-dev (100%) -> health check
#   master      --push--> test -> build -> deploy to papr-cloud-agent-gateway as a 0% "candidate"
#                         -> health check on the candidate URL
#                         -> WAIT for approval (environment: cloud-agent-gateway-production, a reviewer other than the merger)
#                         -> shift 100% traffic to the candidate
#
# Only the image changes: env, secrets, scaling and the service account stay as configured.
# Rollback: re-run the "promote" job of an earlier successful run, or
#   gcloud run services update-traffic papr-cloud-agent-gateway --to-revisions=<previous-revision>=100

on:
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile.cloud-agent-gateway"
      - "tsconfig*.json"
      - ".github/workflows/deploy-cloud-agent-gateway.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud-agent-gateway-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: gen-lang-client-0873281406
  GCP_REGION: us-west1
  REGISTRY: us-west1-docker.pkg.dev
  IMAGE: us-west1-docker.pkg.dev/gen-lang-client-0873281406/papr-apps/cloud-agent-gateway
  DEV_SERVICE: papr-cloud-agent-gateway-dev
  PROD_SERVICE: papr-cloud-agent-gateway

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - name: CI test tier
        run: npm run test:sequential -- --tier=ci

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          # development keeps the dev-<sha> tags used so far; master gets master-<sha>.
          PREFIX=$([ "${GITHUB_REF_NAME}" = "development" ] && echo dev || echo "${GITHUB_REF_NAME}")
          echo "image=${IMAGE}:${PREFIX}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGISTRY}" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud-agent-gateway
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=cloud-agent-gateway
          cache-to: type=gha,mode=min,scope=cloud-agent-gateway

  deploy-dev:
    name: Deploy to dev
    if: github.ref_name == 'development'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloud-agent-gateway-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        run: |
          PREV=$(gcloud run services describe "${DEV_SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.latestReadyRevisionName)')
          gcloud run deploy "${DEV_SERVICE}" \
            --image="${{ needs.build.outputs.image }}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" \
            --labels=commit=${GITHUB_SHA::8}
          URL=$(gcloud run services describe "${DEV_SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Rollback: gcloud run services update-traffic ${DEV_SERVICE} --to-revisions=${PREV}=100 --region=${GCP_REGION} --project=${GCP_PROJECT_ID}" >> "$GITHUB_STEP_SUMMARY"
      # The service is private (invoker-only), so the check needs an ID token.
      - id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Health check
        env:
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sf --max-time 10 -H "Authorization: Bearer ${TOKEN}" "${URL}/health" && exit 0
            sleep 10
          done
          echo "::error::Dev agent gateway health check failed"; exit 1

  deploy-candidate:
    name: Deploy production candidate (0% traffic)
    if: github.ref_name == 'master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        run: |
          CTAG="c-${GITHUB_SHA::8}"
          gcloud run deploy "${PROD_SERVICE}" \
            --image="${{ needs.build.outputs.image }}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" \
            --no-traffic --tag="${CTAG}" \
            --labels=commit=${GITHUB_SHA::8}
          REV=$(gcloud run services describe "${PROD_SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format="value(status.traffic[?tag='${CTAG}'].revisionName)" 2>/dev/null || true)
          [ -z "$REV" ] && REV=$(gcloud run revisions list --service="${PROD_SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --sort-by=~metadata.creationTimestamp --limit=1 --format='value(metadata.name)')
          BASE=$(gcloud run services describe "${PROD_SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')
          CURL=${BASE/https:\/\//https://${CTAG}---}
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"
          echo "base_url=${BASE}" >> "$GITHUB_OUTPUT"
          echo "candidate_url=${CURL}" >> "$GITHUB_OUTPUT"
      # Private service: mint ID tokens for both the tag URL and the base URL
      # and accept whichever Cloud Run takes for the tagged revision.
      - id: tok_candidate
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.candidate_url }}
          id_token_include_email: true
          create_credentials_file: false
      - id: tok_base
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.base_url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Health check candidate
        env:
          T1: ${{ steps.tok_candidate.outputs.id_token }}
          T2: ${{ steps.tok_base.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.candidate_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            for T in "$T1" "$T2"; do
              curl -sf --max-time 10 -H "Authorization: Bearer ${T}" "${URL}/health" && exit 0
            done
            sleep 10
          done
          echo "::error::Candidate health check failed; production traffic was not changed"; exit 1
      - name: Summary
        run: |
          {
            echo "### Agent gateway production candidate ready"
            echo "- Revision: \`${{ steps.deploy.outputs.revision }}\` (0% traffic)"
            echo "- Candidate URL: ${{ steps.deploy.outputs.candidate_url }} (private; needs an ID token)"
            echo "- Approve the **Promote** job to send 100% of cloud agent runs to it."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote to 100% traffic (requires approval)
    if: github.ref_name == 'master'
    needs: deploy-candidate
    runs-on: ubuntu-latest
    environment:
      name: cloud-agent-gateway-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: shift
        run: |
          PREV=$(gcloud run services describe "${PROD_SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.traffic[0].revisionName)')
          echo "Previous revision: ${PREV}"
          gcloud run services update-traffic "${PROD_SERVICE}" \
            --to-revisions="${{ needs.deploy-candidate.outputs.revision }}=100" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}"
          echo "url=$(gcloud run services describe "${PROD_SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
          echo "Rollback: gcloud run services update-traffic ${PROD_SERVICE} --to-revisions=${PREV}=100 --region=${GCP_REGION} --project=${GCP_PROJECT_ID}" >> "$GITHUB_STEP_SUMMARY"
      - id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.shift.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Verify production gateway
        env:
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.shift.outputs.url }}
        run: |
          sleep 15
          curl -sf --max-time 15 -H "Authorization: Bearer ${TOKEN}" "${URL}/health"
