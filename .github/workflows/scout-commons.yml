name: Scout Commons
on:
  pull_request:
    paths: ["services/scout-commons/**", ".github/workflows/scout-commons.yml"]
  push:
    branches: [development]
    paths: ["services/scout-commons/**"]
permissions:
  contents: read
jobs:
  test:
    name: Scout Commons tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/scout-commons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check commons tests && ruff format --check commons tests
      - run: pytest -q
