name: Deploy Cloud Agent Gateway (dev)

# development --push--> build -> deploy papr-cloud-agent-gateway-dev -> health check
#
# Dev only. memoryserver-development sends cloud agent runs here
# (CLOUD_AGENT_GATEWAY_URL), so fixes merged to development can be tested
# end to end before release. Production papr-cloud-agent-gateway is still
# deployed with scripts/deploy-cloud-agent-gateway.mjs.
#
# Scales to zero (min-instances=0): no cost while idle; the first run after
# idle pays a cold start of a few seconds.

on:
  push:
    branches: [development]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile.cloud-agent-gateway"
      - "tsconfig*.json"
      - ".github/workflows/deploy-cloud-agent-gateway-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud-agent-gateway-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCP_PROJECT_ID: gen-lang-client-0873281406
  GCP_REGION: us-west1
  REGISTRY: us-west1-docker.pkg.dev
  IMAGE: us-west1-docker.pkg.dev/gen-lang-client-0873281406/papr-apps/cloud-agent-gateway
  RUNTIME_SA: papr-cloud-agent-gateway@gen-lang-client-0873281406.iam.gserviceaccount.com
  SERVICE: papr-cloud-agent-gateway-dev

jobs:
  deploy-dev:
    name: Build and deploy to dev
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: cloud-agent-gateway-dev
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${IMAGE}:dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGISTRY}" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud-agent-gateway
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=cloud-agent-gateway
          cache-to: type=gha,mode=min,scope=cloud-agent-gateway
      - id: deploy
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${{ steps.meta.outputs.image }}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" \
            --service-account="${RUNTIME_SA}" \
            --no-allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --cpu=4 --memory=8Gi --cpu-boost --concurrency=1 --timeout=1800 \
            --update-secrets=PAPR_CLOUD_AGENT_GATEWAY_KEY=papr-cloud-agent-gateway-key:latest,PAPR_CLOUD_APP_HOST_KEY=papr-cloud-app-host-key-dev:latest \
            --update-env-vars=GATEWAY_MODE=cloud_agent,CLOUD_SYNC_ENABLED=false,TURSO_SYNC_ENABLED=false,PAPR_CLOUD_SANDBOX_TURSO_DIRECT=1,NODE_ENV=production,CLOUD_AGENT_GATEWAY_TIMEOUT_SEC=1800,PAPR_MEMORY_SERVER_URL=https://memoryserver-development-7dckb3v3oa-uw.a.run.app,PAPR_CLOUD_APPS_HOST=https://papr-cloud-app-host-dev-223473570766.us-west1.run.app,PAPR_APP_REPO_WRITER_URL=https://app-repo-writer-dev-223473570766.us-west1.run.app \
            --labels=env=dev,commit=${GITHUB_SHA::8}
          URL=$(gcloud run services describe "${SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
      - id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Health check
        env:
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sf --max-time 30 -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/health" && exit 0
            sleep 10
          done
          echo "::error::Dev gateway health check failed"; exit 1
