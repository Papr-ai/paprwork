name: Deploy Cloud Agent Gateway (dev)

# Keeps papr-cloud-agent-gateway-dev on the tip of development, so cloud agent
# job fixes can be verified on dev right after merge (previously a manual
# Cloud Build + `gcloud run services update`).
#
#   development --push--> test -> build -> deploy image to papr-cloud-agent-gateway-dev -> health check
#
# Only the image changes: env, secrets, scaling and the service account stay
# as configured on the service. Production (papr-cloud-agent-gateway) is not
# touched by this workflow.
# Rollback: gcloud run services update-traffic papr-cloud-agent-gateway-dev --to-revisions=<previous-revision>=100

on:
  push:
    branches: [development]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile.cloud-agent-gateway"
      - "tsconfig*.json"
      - ".github/workflows/deploy-cloud-agent-gateway-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud-agent-gateway-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: gen-lang-client-0873281406
  GCP_REGION: us-west1
  REGISTRY: us-west1-docker.pkg.dev
  IMAGE: us-west1-docker.pkg.dev/gen-lang-client-0873281406/papr-apps/cloud-agent-gateway
  SERVICE: papr-cloud-agent-gateway-dev

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - name: CI test tier
        run: npm run test:sequential -- --tier=ci

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${IMAGE}:dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGISTRY}" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud-agent-gateway
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=cloud-agent-gateway
          cache-to: type=gha,mode=min,scope=cloud-agent-gateway

  deploy-dev:
    name: Deploy to dev
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloud-agent-gateway-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        run: |
          PREV=$(gcloud run services describe "${SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.latestReadyRevisionName)')
          gcloud run deploy "${SERVICE}" \
            --image="${{ needs.build.outputs.image }}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" \
            --labels=commit=${GITHUB_SHA::8}
          URL=$(gcloud run services describe "${SERVICE}" --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Rollback: gcloud run services update-traffic ${SERVICE} --to-revisions=${PREV}=100 --region=${GCP_REGION} --project=${GCP_PROJECT_ID}" >> "$GITHUB_STEP_SUMMARY"
      # The service is private (invoker-only), so the check needs an ID token.
      - id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
      - name: Health check
        env:
          TOKEN: ${{ steps.idtoken.outputs.id_token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sf --max-time 10 -H "Authorization: Bearer ${TOKEN}" "${URL}/health" && exit 0
            sleep 10
          done
          echo "::error::Dev agent gateway health check failed"; exit 1
