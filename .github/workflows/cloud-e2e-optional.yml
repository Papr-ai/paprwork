name: Cloud E2E (optional)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  cloud-e2e:
    name: Contribute-back + track pull-on-publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    # `secrets` can't be used in step `if:` — GitHub rejects the whole file.
    # Expose it as job env and gate on that instead.
    env:
      PAPR_API_KEY: ${{ secrets.PAPR_API_KEY }}
      PAPR_MEMORY_SERVER_URL: ${{ vars.PAPR_MEMORY_SERVER_URL || 'https://memory.papr.ai' }}

    steps:
      - name: Check for API key
        id: gate
        run: |
          if [ -n "$PAPR_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping cloud E2E — add the PAPR_API_KEY repository secret to enable"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - name: Rebuild native modules for Electron
        if: steps.gate.outputs.enabled == 'true'
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build gateway
        if: steps.gate.outputs.enabled == 'true'
        run: npm run build:gateway

      - name: Start gateway test stack
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/test-stack.mjs up

      - name: Run contribute-back E2E
        if: steps.gate.outputs.enabled == 'true'
        run: npm run test:contribute-back-e2e

      - name: Run track pull-on-publish E2E
        if: steps.gate.outputs.enabled == 'true'
        run: npm run test:track-pull-on-publish-e2e -- --poll-seconds=60

      - name: Stop test stack
        if: always() && steps.gate.outputs.enabled == 'true'
        run: node scripts/test-stack.mjs down
