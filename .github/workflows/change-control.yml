name: Change control
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  change-control:
    name: Change control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No dependencies or symlinks committed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -e
          added=$(git diff --diff-filter=A --raw "origin/$BASE...HEAD")
          deps=$(printf "%s\n" "$added" | awk -F'\t' 'NF>1{print $2}' | grep -E '(^|/)(node_modules|\.venv|__pycache__)(/|$)' || true)
          links=$(printf "%s\n" "$added" | awk '$2=="120000"{print $NF}')
          if [ -n "$deps$links" ]; then
            [ -n "$deps" ] && printf "%s\n" "$deps" | head -20 | sed 's/^/::error::Dependency folder committed: /'
            [ -n "$links" ] && printf "%s\n" "$links" | head -20 | sed 's/^/::error::Symlink committed: /'
            echo "::error::Remove them with git rm --cached <path>. Worktrees often symlink node_modules; stage files by name instead of git add ."
            exit 1
          fi
          echo "No dependencies or symlinks: ok"
      - name: Ticket linked and branch flow
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -e
          # Release PRs (development or release/* into the prod branch) carry the tickets of their changes.
          if [ "$HEAD" = "development" ] || [[ "$HEAD" == release/* ]]; then echo "Release PR: ok"; exit 0; fi
          if [[ "$AUTHOR" == *"[bot]" ]]; then echo "Bot PR: ok"; exit 0; fi
          if [ "$BASE" = "main" ] || [ "$BASE" = "master" ]; then
            if [[ "$HEAD" != hotfix/* ]]; then
              echo "::error::Changes go to development first. Only development, release/* or hotfix/* branches may target $BASE."
              exit 1
            fi
          fi
          if ! printf "%s" "$BODY" | grep -Eiq "(/issues/[0-9]+|(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|ticket|issue)[[:space:]]*:?[[:space:]]*#[0-9]+)"; then
            echo "::error::Link a ticket in the PR description (e.g. \"Ticket: #123\", a GitHub issue in this repo)."
            exit 1
          fi
          echo "Ticket linked: ok"
