<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Installation complete</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: #1d1d1f;
    }
    strong { font-weight: 600; }
    p { margin: 0 0 10px; }
    .open-app {
      display: inline-block;
      margin: 12px 0 14px;
      padding: 8px 16px;
      background: #0071e3;
      color: #fff !important;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .open-app:hover { background: #0077ed; }
    .hint { color: #6e6e73; font-size: 12px; }
  </style>
</head>
<body>
  <p><strong>Papr Work is installed.</strong></p>
  <p>
    When you click <strong>Close</strong>, Papr Work should open automatically.
    If it does not, use the button below or open it from Applications.
  </p>
  <p>
    <a class="open-app" href="file:///Applications/Papr%20Work.app/">Open Papr Work</a>
  </p>
  <p class="hint">
    You can also press <strong>⌘Space</strong>, type <strong>Papr Work</strong>, and press Return.
  </p>
</body>
</html>
